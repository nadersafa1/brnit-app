# App-local bun config. Bun uses the nearest bunfig.toml, so this replaces the
# repo-root one when tests run with `apps/web` as the cwd (which is how the
# `test` script and turbo invoke them).
#
# The root file preloads server env placeholders this app has no use for; what
# the web tests need instead are the `VITE_*` vars `@brnit/env/web` validates.

[test]
preload = ["./test-setup.ts"]
# `bun test src` treats its argument as a path *filter*, and every path under
# `legacy/` contains "src" too. Excluding the quarantined pre-overhaul tree here
# is what keeps the filter meaning "this app's source".
pathIgnorePatterns = ["/legacy/", "/dist/"]

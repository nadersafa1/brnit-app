<!doctype html>
<html lang="en" suppresshydrationwarning>
	<head>
		<!--
			Blocking theme script. A Vite SPA has no server render, so without this the
			first paint happens on the light palette and then flips. It must mirror
			next-themes exactly: same storage key, same "system" fallback, same class.
			Keep it in sync with the ThemeProvider in src/routes/__root.tsx.
		-->
		<script>
		"use strict";
		(() => {
			const root = document.documentElement;
			const apply = (theme) => {
				root.classList.remove("light", "dark");
				root.classList.add(theme);
				root.style.colorScheme = theme;
			};
			try {
				const stored = localStorage.getItem("brnit-ui-theme");
				if (stored === "light" || stored === "dark") {
					apply(stored);
					return;
				}
				apply(
					window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light"
				);
			} catch {
				apply("light");
			}
		})();
		</script>
		<!--
			Blocking locale script, twinned with the theme script above. Without it an
			Arabic visitor gets one left-to-right paint before React hydrates and
			flips the document. It must mirror `src/lib/i18n/locales.ts`: same
			storage key, same supported list, same navigator fallback.
		-->
		<script>
		"use strict";
		(() => {
			const locales = ["en", "ar"];
			const dirs = { ar: "rtl", en: "ltr" };
			const apply = (locale) => {
				document.documentElement.lang = locale;
				document.documentElement.dir = dirs[locale] || "ltr";
			};
			try {
				const stored = localStorage.getItem("brnit-locale");
				if (locales.includes(stored)) {
					apply(stored);
					return;
				}
			} catch {}
			for (const preference of navigator.languages || []) {
				const base = String(preference).split("-")[0];
				if (locales.includes(base)) {
					apply(base);
					return;
				}
			}
			apply("en");
		})();
		</script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Brnit — healthy life challenges, diet plans and body composition tracking.">
		<link rel="icon" type="image/png" href="/Brnit-Logo.png">
		<!--
			General Sans is design.json's typography.fontFamily.primary and is what
			`--font-sans` in @brnit/ui/globals.css names, but nothing in the repo ever
			loaded it — every surface silently fell back to system-ui. It is not on
			Google Fonts; Fontshare (Indian Type Foundry) is the free source.

			Four faces only, matching design.json typography.weights: 400 (the default
			weight of any element that sets none), 500 (body/caption), 600 (h3, card
			titles) and 700 (display/h1/h2). No italics — the design uses none.
			`display=swap` so the fallback paints immediately and text is never invisible.
		-->
		<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
		<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
		<!--
			General Sans has no Arabic glyphs. IBM Plex Sans Arabic is the companion
			face for `lang="ar"` (wired up in `src/index.css`); its proportions and
			weights line up with the Latin scale, so a language switch does not
			resize the page.
		-->
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
		<title>Brnit</title>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

# Local Redis for BullMQ background jobs. See docs/BACKGROUND_JOBS.md.
# Start with: docker compose up -d
# Set REDIS_PORT if 6379 is already taken on your machine.
services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
